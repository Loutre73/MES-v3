name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r collector/requirements.txt -r api/requirements.txt -r simulator/requirements.txt pytest httpx
      - run: cd collector && python -m pytest -q tests
      - run: cd api && python -m pytest -q tests
      - run: python -m pytest -q ops/tests simulator/tests deploy/mac/tests
      - name: Syntaxe de l'interface web
        run: for f in web/*.js; do node --check "$f"; done

  smoke:
    # Pile complète avec le simulateur : vérifie que les données arrivent dans l'historian
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Démarrage en mode démonstration
        working-directory: deploy
        env:
          SIM_TOTAL_TAGS: "2000"
        run: ./mesctl install --demo
      - name: Attente des premières valeurs
        working-directory: deploy
        run: |
          for i in $(seq 1 60); do
            n=$(docker compose --env-file site.env exec -T db psql -U mes -d mes -Atc "SELECT count(*) FROM historian.value WHERE time > now() - interval '10 seconds'")
            echo "valeurs des 10 dernières secondes : $n"
            [ "$n" -gt 100 ] && exit 0
            sleep 5
          done
          docker compose --env-file site.env logs collector
          exit 1
      - name: Application (connexion, découverte, recette chargée dans l'automate simulé)
        working-directory: deploy
        run: |
          pw=$(grep ^ADMIN_PASSWORD site.env | cut -d= -f2)
          curl -sf -c cj -H 'Content-Type: application/json' -d "{\"username\":\"admin\",\"password\":\"$pw\"}" http://localhost/api/session
          curl -sf -b cj http://localhost/api/catalogue/machines | python3 -c "import sys,json; n=len(json.load(sys.stdin)); print(n, 'machines'); assert n == 125"
          curl -sf -b cj http://localhost/api/tableau-de-bord > /dev/null
          # vues de l'interface : détail de ligne, séries horaires, planning (échange de deux postes à venir)
          lid1=$(curl -sf -b cj http://localhost/api/tableau-de-bord | python3 -c "import sys,json; print(json.load(sys.stdin)['lignes'][0]['id'])")
          curl -sf -b cj http://localhost/api/lignes/$lid1 | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['ligne']['name']"
          curl -sf -b cj http://localhost/api/usine/horaire > /dev/null
          for i in $(seq 1 30); do n=$(curl -sf -b cj "http://localhost/api/shifts?jours=3" | python3 -c "import sys,json; print(len(json.load(sys.stdin)))"); [ "$n" -gt 1 ] && break; sleep 3; done
          ids=$(curl -sf -b cj "http://localhost/api/shifts?depuis=$(date -u -d tomorrow +%Y-%m-%dT%H:%M:%SZ)&jours=1" | python3 -c "import sys,json; s=json.load(sys.stdin); print(s[0]['id'], s[1]['id'])")
          set -- $ids
          curl -sf -b cj -X PATCH -H 'Content-Type: application/json' -d '{"team": "A", "kind": "arret"}' http://localhost/api/shifts/$1
          curl -sf -b cj -X POST -H 'Content-Type: application/json' -d "{\"a\": $1, \"b\": $2}" http://localhost/api/shifts/echanger
          curl -sf -b cj "http://localhost/api/shifts?depuis=$(date -u -d tomorrow +%Y-%m-%dT%H:%M:%SZ)&jours=1" | python3 -c "import sys,json; s={x['id']: x for x in json.load(sys.stdin)}; assert s[$2]['kind'] == 'arret' and s[$2]['team'] == 'A'"
          lid=$(curl -sf -b cj -X POST http://localhost/api/recettes/versions/1/charger | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          for i in $(seq 1 20); do r=$(curl -sf -b cj http://localhost/api/recettes/chargements/$lid | python3 -c "import sys,json; print(json.load(sys.stdin)['result'])"); [ "$r" != en_cours ] && break; sleep 1; done
          echo "chargement : $r"; [ "$r" = acceptee ]
          curl -sf -b cj -o /dev/null http://localhost/grafana/api/health
          curl -sf -b cj http://localhost/systeme | grep -q 'ops.js'         # console d'exploitation
          curl -sf http://localhost/systeme | grep -q '<form'                # sans session : connexion
      - name: Console d'exploitation (état, historisation, simulation, arrêt et redémarrage de l'application)
        working-directory: deploy
        run: |
          pw=$(grep ^ADMIN_PASSWORD site.env | cut -d= -f2)
          curl -sf -c cj -H 'Content-Type: application/json' -d "{\"username\":\"admin\",\"password\":\"$pw\"}" http://localhost/api/session > /dev/null
          J='-sf -b cj -H Content-Type:application/json'
          for i in $(seq 1 20); do r=$(curl $J http://localhost/api/ops/etat | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['application'], bool(d['collecteur']), bool(d['simulateur']))"); echo "$r"; [ "$r" = "en_service True True" ] && break; sleep 3; done
          [ "$r" = "en_service True True" ]
          curl $J -X PUT -d '{"dbs": {"DB_Process": false}}' http://localhost/api/ops/historisation | python3 -c "import sys,json; assert json.load(sys.stdin)['dbs_suspendus'] == ['DB_Process']"
          curl $J -X PUT -d '{"dbs": {"DB_Process": true}}' http://localhost/api/ops/historisation > /dev/null
          curl $J -X POST -d '{"cible": "L3", "duree_min": 1}' http://localhost/api/ops/simulation/scenarios/panne_ligne > /dev/null
          curl $J "http://localhost/api/ops/simulation/tags?noms=DB_Lignes.L3.Marche" | python3 -c "import sys,json; print(json.load(sys.stdin))"
          curl $J -X POST -d '{}' http://localhost/api/ops/application/stop > /dev/null
          curl -s -o /dev/null -w '%{http_code}' -b cj http://localhost/systeme | grep -q 200    # console servie, API arrêtée
          curl $J -X POST -d '{}' http://localhost/api/ops/application/start > /dev/null
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost/api/sante && break; sleep 2; done
          curl -sf http://localhost/api/sante
          curl $J "http://localhost/api/ops/journal?n=10"
      - name: Supervision technique (toutes les cibles Prometheus remontent)
        working-directory: deploy
        run: |
          ./mesctl monitoring on
          for i in $(seq 1 30); do
            r=$(docker compose --env-file site.env exec -T prometheus wget -qO- 'http://localhost:9090/api/v1/targets?state=active' \
                | python3 -c "import sys,json; t=json.load(sys.stdin)['data']['activeTargets']; print(len(t), sum(x['health']=='up' for x in t), ' '.join(x['labels']['job'] for x in t if x['health']!='up'))")
            echo "cibles, en ligne, en erreur : $r"
            set -- $r; [ "$1" = 7 ] && [ "$2" = 7 ] && exit 0
            sleep 5
          done
          exit 1
      - name: État
        if: always()
        working-directory: deploy
        run: ./mesctl status

  images:
    # Publication des images à chaque tag de version (v0.1.0 -> :0.1.0)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: smoke
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: mes-collector, context: collector }
          - { name: mes-migrate, context: db }
          - { name: mes-simulator, context: simulator }
          - { name: mes-api, context: ., file: api/Dockerfile }
          - { name: mes-web, context: web }
          - { name: mes-ops, context: ops }
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file || format('{0}/Dockerfile', matrix.context) }}
          push: true
          tags: ghcr.io/loutre73/${{ matrix.name }}:${{ steps.version.outputs.v }}
