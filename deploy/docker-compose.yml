# MES v3 - pile standard, identique sur tous les sites.
# Tout ce qui est propre au site est dans site.env (voir site.env.example).
name: mes


services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: mes
      POSTGRES_USER: mes
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans site.env}
    command: ["postgres", "-c", "shared_buffers=${DB_SHARED_BUFFERS:-4GB}", "-c", "max_wal_size=4GB",
              "-c", "timescaledb.max_background_workers=8",
              # pg_stat_statements : temps des requêtes SQL (tableau de bord Système)
              "-c", "shared_preload_libraries=timescaledb,pg_stat_statements",
              "-c", "pg_stat_statements.max=1000", "-c", "track_io_timing=on"]
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mes -d mes"]
      interval: 5s
      timeout: 5s
      retries: 30
    shm_size: 1g

  migrate:
    image: ${MES_REGISTRY:-ghcr.io/loutre73}/mes-migrate:${MES_VERSION:-dev}
    build: ../db
    environment:
      DATABASE_URL: postgresql://mes:${DB_PASSWORD}@db:5432/mes
      HISTORIAN_RETENTION: ${HISTORIAN_RETENTION:-1 year}
      HISTORIAN_CHUNK_INTERVAL: ${HISTORIAN_CHUNK_INTERVAL:-6 hours}
      AGGREGATE_1MIN_RETENTION: ${AGGREGATE_1MIN_RETENTION:-1 year}
      AGGREGATE_1H_RETENTION: ${AGGREGATE_1H_RETENTION:-3 years}
      MES_READER_PASSWORD: ${MES_READER_PASSWORD:?MES_READER_PASSWORD manquant dans site.env}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  collector:
    image: ${MES_REGISTRY:-ghcr.io/loutre73}/mes-collector:${MES_VERSION:-dev}
    build: ../collector
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://mes:${DB_PASSWORD}@db:5432/mes
      OPCUA_ENDPOINT: ${OPCUA_ENDPOINT:?OPCUA_ENDPOINT manquant dans site.env}
      OPCUA_SECURITY: ${OPCUA_SECURITY:-}
      OPCUA_USERNAME: ${OPCUA_USERNAME:-}
      OPCUA_PASSWORD: ${OPCUA_PASSWORD:-}
      BROWSE_ROOT: ${BROWSE_ROOT:-PLC_1/DataBlocksGlobal}
      SAMPLING_MS: ${SAMPLING_MS:-1000}
      ITEMS_PER_SUBSCRIPTION: ${ITEMS_PER_SUBSCRIPTION:-1000}
      # le catalogue est alimenté par la découverte de l'application (ou ./mesctl discover)
      BOOTSTRAP_BROWSE: ${BOOTSTRAP_BROWSE:-false}
    volumes:
      - collector-spool:/spool
      - ${OPCUA_CERT_DIR:-./certs}:/certs:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Le collecteur doit joindre l'automate : sur site, prévoir l'accès au réseau automate.

  api:
    image: ${MES_REGISTRY:-ghcr.io/loutre73}/mes-api:${MES_VERSION:-dev}
    build:
      context: ..
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://mes:${DB_PASSWORD}@db:5432/mes
      MES_VERSION: ${MES_VERSION:-dev}
      OPCUA_ENDPOINT: ${OPCUA_ENDPOINT}
      OPCUA_SECURITY: ${OPCUA_SECURITY:-}
      OPCUA_USERNAME: ${OPCUA_USERNAME:-}
      OPCUA_PASSWORD: ${OPCUA_PASSWORD:-}
      OPCUA_WRITE_USERNAME: ${OPCUA_WRITE_USERNAME:-}
      OPCUA_WRITE_PASSWORD: ${OPCUA_WRITE_PASSWORD:-}
      BROWSE_ROOT: ${BROWSE_ROOT:-PLC_1/DataBlocksGlobal}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY manquant dans site.env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD manquant dans site.env}
      AUTH_LDAP_URL: ${AUTH_LDAP_URL:-}
      AUTH_LDAP_DOMAIN: ${AUTH_LDAP_DOMAIN:-}
      AUTH_LDAP_BASE_DN: ${AUTH_LDAP_BASE_DN:-}
      AUTH_LDAP_GROUP_ROLES: ${AUTH_LDAP_GROUP_ROLES:-}
      SITE_TIMEZONE: ${SITE_TIMEZONE:-Europe/Paris}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - ${OPCUA_CERT_DIR:-./certs}:/certs:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/sante', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: ${MES_REGISTRY:-ghcr.io/loutre73}/mes-web:${MES_VERSION:-dev}
    build: ../web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:8080"
    depends_on:
      - api
      - grafana

  grafana:
    image: grafana/grafana-oss:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD manquant dans site.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DEFAULT_LOCALE: fr-FR
      # Grafana est servi par l'application sous /grafana/, avec la session MES (pas de second mot de passe)
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_HEADERS: Role:X-WEBAUTH-ROLE
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/mes-performance.json
      MES_READER_PASSWORD: ${MES_READER_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    # Pas de port publié : Grafana n'est joignable qu'à travers l'application (web).
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Simulateur S7-1500 : développement, démonstration et tests (profil "sim")
  simulator:
    image: ${MES_REGISTRY:-ghcr.io/loutre73}/mes-simulator:${MES_VERSION:-dev}
    build: ../simulator
    profiles: ["sim"]
    restart: unless-stopped
    environment:
      SIM_TOTAL_TAGS: ${SIM_TOTAL_TAGS:-10000}
      SIM_CHANGE_RATIO: ${SIM_CHANGE_RATIO:-0.3}

  # ---- Surveillance technique (profil "monitoring") : tableau de bord Grafana « Système » ----
  # Prometheus collecte toutes les 10 s ; volume plafonné par PROMETHEUS_RETENTION_SIZE.
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml",
              "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}",
              "--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-2GB}"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  # Hôte Docker : CPU, mémoire, disques (IO/s, débit, occupation), réseau, charge
  node-exporter:
    image: prom/node-exporter:v1.8.2
    profiles: ["monitoring"]
    restart: unless-stopped
    command: ["--path.procfs=/host/proc", "--path.sysfs=/host/sys", "--path.rootfs=/rootfs",
              "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($$|/)",
              "--collector.netdev.device-exclude=^(veth.*|br-.*|docker0|lo)$$"]
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

  # Conteneurs : CPU, mémoire, IO disque et réseau, redémarrages et santé par service.
  # Petit exporter maison (bibliothèque standard Python) : cAdvisor ne reconnaît pas les conteneurs
  # avec le magasin d'images containerd de Docker 29+.
  docker-exporter:
    image: python:3.12-slim
    profiles: ["monitoring"]
    restart: unless-stopped
    command: ["python", "-u", "/app/docker_exporter.py"]
    volumes:
      # accès en lecture à l'API Docker : équivalent root sur l'hôte, comme cAdvisor
      - /var/run/docker.sock:/var/run/docker.sock
      - ./monitoring/docker_exporter.py:/app/docker_exporter.py:ro

  # Processus de l'hôte regroupés par nom : postgres, python (collecteur, API), nginx, grafana...
  process-exporter:
    image: ncabatoff/process-exporter:0.8.7
    profiles: ["monitoring"]
    restart: unless-stopped
    command: ["--procfs=/host/proc", "--config.path=/config/process-exporter.yml"]
    volumes:
      - /proc:/host/proc:ro
      - ./monitoring/process-exporter.yml:/config/process-exporter.yml:ro

  # PostgreSQL / TimescaleDB : connexions, transactions, cache, verrous, taille
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: db:5432/mes?sslmode=disable
      DATA_SOURCE_USER: mes
      DATA_SOURCE_PASS: ${DB_PASSWORD}
    command: ["--collector.stat_statements", "--collector.long_running_transactions",
              "--collector.database_wraparound"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  collector-spool:
  grafana-data:
  prometheus-data:
