# Surveillance technique du MES v3 (profil "monitoring"), lue par le tableau de bord Grafana « Système ».
global:
  scrape_interval: 10s
  scrape_timeout: 8s
  evaluation_interval: 10s

scrape_configs:
  - job_name: collector
    static_configs:
      - targets: ["collector:9108"]
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: docker
    static_configs:
      - targets: ["docker-exporter:9417"]
  - job_name: processes
    static_configs:
      - targets: ["process-exporter:9256"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
