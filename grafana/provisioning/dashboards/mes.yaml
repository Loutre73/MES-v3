apiVersion: 1
providers:
  - name: MES v3
    folder: MES v3
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
  # copies anglaises générées par grafana/generate/traduire.py (uid suffixé -en)
  - name: MES v3 (English)
    folder: MES v3 (English)
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards-en
