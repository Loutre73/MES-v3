apiVersion: 1
datasources:
  - name: Historian
    uid: historian
    type: grafana-postgresql-datasource
    url: db:5432
    user: mes_reader
    isDefault: true
    jsonData:
      database: mes
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
      timeInterval: 1s
    secureJsonData:
      password: ${MES_READER_PASSWORD}
    editable: false
