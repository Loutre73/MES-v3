<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MES v3</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preload" href="vendor/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // thème choisi (clair / sombre) appliqué avant le premier affichage
    try { var t = localStorage.getItem("mes-theme"); } catch (e) {}
    document.documentElement.dataset.theme = t === "sombre" || (!t && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2306D16F'/%3E%3Cpath d='M3 12V4l5 5 5-5v8' stroke='%23000B44' stroke-width='2' fill='none'/%3E%3C/svg%3E">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
