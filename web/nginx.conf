# Point d'entrée unique : application MES, API et Grafana (Grafana authentifié par la session MES)
server {
    listen 8080;
    server_name _;
    client_max_body_size 20m;
    absolute_redirect off;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json text/csv image/svg+xml;

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /_auth {
        internal;
        proxy_pass http://api:8000/api/session/proxy;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location /grafana/ {
        auth_request /_auth;
        auth_request_set $mes_user $upstream_http_x_mes_user;
        auth_request_set $mes_role $upstream_http_x_mes_role;
        error_page 401 = @login;
        proxy_set_header X-WEBAUTH-USER $mes_user;
        proxy_set_header X-WEBAUTH-ROLE $mes_role;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_http_version 1.1;
        proxy_pass http://grafana:3000;
    }

    location @login {
        return 302 /;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
