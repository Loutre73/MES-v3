# Point d'entrée unique : application MES, API et Grafana (Grafana authentifié par la session MES)
server {
    listen 8080;
    server_name _;
    client_max_body_size 20m;
    absolute_redirect off;
    root /usr/share/nginx/html;

    # Résolution des services à chaque requête (DNS Docker) : nginx démarre et reste en service
    # même quand l'API ou Grafana sont arrêtés depuis la console d'exploitation.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_up http://api:8000;
    set $grafana_up http://grafana:3000;
    set $ops_up http://ops:9200;

    gzip on;
    gzip_types text/css application/javascript application/json text/csv image/svg+xml;

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    # Console d'exploitation (architecture, services, historisation, simulation, tableau Grafana « Système »),
    # hors de l'application MES. Servie avec l'agent d'exploitation : disponible même application arrêtée.
    # Sans session MES : formulaire de connexion propre à la page, puis retour sur /systeme.
    location = /systeme {
        auth_request /_auth_ops;
        error_page 401 = /systeme-connexion.html;
        add_header Cache-Control "no-cache";
        try_files /systeme.html =404;
    }
    location = /systeme/ { return 302 /systeme; }
    location = /systeme-connexion.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ops/ {
        proxy_pass $ops_up;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 90s;
        error_page 502 503 504 = @ops_down;
    }
    # Archive de version pour un site sans Internet (plusieurs Go) : passée telle quelle à l'agent, qui la donne à Docker
    location = /api/ops/maj/archive {
        proxy_pass $ops_up;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
    location @ops_down {
        default_type application/json;
        return 503 '{"detail": "Agent d\'exploitation injoignable"}';
    }

    location = /_auth_ops {
        internal;
        proxy_pass $ops_up/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location /api/ {
        proxy_pass $api_up;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /_auth {
        internal;
        proxy_pass $api_up/api/session/proxy;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location /grafana/ {
        auth_request /_auth;
        auth_request_set $mes_user $upstream_http_x_mes_user;
        auth_request_set $mes_role $upstream_http_x_mes_role;
        error_page 401 = @login;
        proxy_set_header X-WEBAUTH-USER $mes_user;
        proxy_set_header X-WEBAUTH-ROLE $mes_role;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_http_version 1.1;
        proxy_pass $grafana_up;
    }

    location @login {
        return 302 /;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
